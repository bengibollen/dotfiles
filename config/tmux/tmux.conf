# Use Ctrl-a as the tmux prefix and keep Ctrl-b available for shell use.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Improve terminal behavior.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 100000
set -s set-clipboard on

# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on

# Start windows and panes at 1 for easier human indexing.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Make splits follow the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Use vim-style keys in copy mode.
setw -g mode-keys vi

# Reload config quickly after edits.
bind r source-file ~/dotfiles/config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Keep status bar readable and aligned with Gruvbox-style ANSI colors.
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=colour3,fg=colour0"
set -g message-style "bg=colour4,fg=colour0"
set -g message-command-style "bg=colour2,fg=colour0"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

setw -g window-status-separator ""
setw -g window-status-style "bg=colour8,fg=colour0"
setw -g window-status-format " #I #W "
setw -g window-status-current-style "bg=colour4,fg=colour0"
setw -g window-status-current-format "#[fg=colour3]#[fg=colour0] #I #W #[fg=colour3]"
setw -g window-status-last-style "bg=colour3,fg=colour0"
setw -g window-status-activity-style "bg=colour1,fg=colour0"

set -g status-left "#[fg=colour0,bg=colour2] #S #[fg=colour2,bg=colour3]"
set -g status-right "#[fg=colour8,bg=colour3]#[fg=colour0,bg=colour8] %Y-%m-%d %H:%M "

# Allow a larger scrollback buffer and easier pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
