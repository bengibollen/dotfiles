"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[╭╴](fg:4)\
$os\
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$nats\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$pijul_channel\
$docker_context\
$package\
$bun\
$dotnet\
$nodejs\
$python\
$memory_usage\
$aws\
$azure\
$direnv\
$env_var\
$custom\
$sudo\
$cmd_duration\
[](fg:4)\
$fill\
[](fg:4)\
$jobs\
$battery\
$time\
$status\
$container\
$netns\
$line_break\
[╰╴](fg:4)\
$shell\
$character"""

[os]
disabled = false
style = 'fg:1'

[dotnet]
disabled = false
format = '[$symbol($tfm)]($style)'
symbol = " "

[username]
show_always = true
format = "[$user]($style) "

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[time]
disabled = false

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[fill]
symbol = " "

[cmd_duration]
min_time = 500
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
